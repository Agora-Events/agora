name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter web lint

      - name: Build
        run: pnpm --filter web build

  playwright-visual:
    name: Playwright Visual Regression
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium browser
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Run visual regression tests
        run: pnpm --filter web test:visual
        env:
          DATABASE_URL: "file:./ci_visual.db"
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_visual_fallback_secret_32bytes' }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshot-diffs
          path: apps/web/tests/visual/__snapshots__
          if-no-files-found: ignore
          retention-days: 7
