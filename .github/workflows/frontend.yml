name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter web lint

      - name: Build
        run: pnpm --filter web build

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    # Run after build succeeds so we know the app compiles cleanly
    needs: build-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Start Next.js dev server
        working-directory: apps/web
        run: pnpm dev &
        env:
          # Provide a dummy secret so JWT signing doesn't fail at runtime
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_fallback_secret' }}
          # Skip Prisma DB calls — tests stub the API layer entirely
          DATABASE_URL: "file:./ci_test.db"

      - name: Wait for Next.js to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Cypress E2E tests
        run: pnpm exec cypress run --spec "cypress/integration/create_event.spec.ts"
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
