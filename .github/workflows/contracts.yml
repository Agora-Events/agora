name: Contract CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "contract/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "contract/**"
      - ".github/workflows/contracts.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain does not read rust-toolchain.toml, so the toolchain input is
        # required. Keep these values in sync with rust-toolchain.toml at the repo root.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain does not read rust-toolchain.toml, so the toolchain input is
        # required. Keep these values in sync with rust-toolchain.toml at the repo root.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target

      - name: Run tests
        run: cargo test --workspace
